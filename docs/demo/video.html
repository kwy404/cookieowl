<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>StarTube demo video</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1027; color: #f3f5fc; font: 600 14px/1.4 system-ui, sans-serif; }
  .sky { position: absolute; inset: 0; background: radial-gradient(circle at 70% 30%, #26336a, #0b1027 70%); }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: drift 9s linear infinite; }
  .moon { position: absolute; right: 14%; top: 18%; width: 54px; height: 54px; border-radius: 50%; background: #f6e2a8; box-shadow: 0 0 30px 6px rgba(246, 226, 168, .35); }
  .label { position: absolute; left: 12px; bottom: 10px; display: flex; gap: 8px; align-items: center; }
  .label i { width: 18px; height: 12px; border-radius: 3px; background: #f2b134; display: inline-block; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-60px); } }
  @media (prefers-reduced-motion: reduce) { .star { animation: none; } }
</style>
</head>
<body>
<div class="sky" id="sky"><div class="moon"></div></div>
<div class="label"><i></i>StarTube: a night sky timelapse (demo, nothing is tracked)</div>
<script>
  var sky = document.getElementById('sky');
  for (var i = 0; i < 70; i++) {
    var s = document.createElement('span');
    s.className = 'star';
    s.style.left = Math.random() * 110 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.opacity = (0.3 + Math.random() * 0.7).toFixed(2);
    s.style.animationDelay = -Math.random() * 9 + 's';
    sky.appendChild(s);
  }
</script>
</body>
</html>
