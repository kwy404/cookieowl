<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cookieowl card</title>
<!-- The social preview and Open Graph card: the night town of the docs site
     (docs/assets/art/scenes/hero-dark.svg, written by npm run docs) with the
     name and the promise. Rendered by scripts/render-images.sh. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body { position: relative; background: #070b22; color: #f8eed8; font-family: "Segoe UI", system-ui, sans-serif; }
  .scene { position: absolute; right: 0; bottom: 0; height: 100vh; width: auto; }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #070b22 0%, rgba(7, 11, 34, .9) 42%, rgba(7, 11, 34, 0) 64%); }
  .text { position: absolute; left: 6.5vw; top: 12vh; width: 50vw; }
  .tale { font-family: "Segoe Print", "Bradley Hand", cursive; font-size: 3.2vh; color: #f2b134; }
  .brand { margin-top: 1.6vh; font-family: Georgia, "Times New Roman", serif; font-size: 13vh; font-weight: 700; line-height: 1; letter-spacing: -.2vh; }
  .brand span { color: #f2b134; font-style: italic; }
  h1 { margin-top: 3vh; font-family: Georgia, "Times New Roman", serif; font-size: 5.4vh; line-height: 1.2; font-weight: 700; }
  p { margin-top: 2.4vh; font-size: 3vh; line-height: 1.45; color: #c9cde6; max-width: 44vw; }
  .chips { display: flex; flex-wrap: wrap; gap: 1.4vh; margin-top: 4vh; }
  .chip { padding: 1.1vh 2.2vh; border-radius: .8vh; border: .35vh solid #1b2547; background: #fffaf0; color: #1b2547; font-size: 2.5vh; font-weight: 700; transform: rotate(-1.5deg); box-shadow: .5vh .5vh 0 rgba(0, 0, 0, .35); }
  .chip:nth-child(2n) { transform: rotate(1.2deg); }
</style>
</head>
<body>
<img class="scene" src="../../docs/assets/art/scenes/hero-dark.svg" alt="">
<div class="fade"></div>
<div class="text">
  <div class="tale">A bedtime story about privacy</div>
  <div class="brand">cookie<span>owl</span></div>
  <h1>Cookie consent that keeps trackers outside the gate until visitors say yes</h1>
  <p>LGPD and GDPR. One script tag, Google Consent Mode v2, auto blocking, five languages. Free and open source.</p>
  <div class="chips"><span class="chip">Under 15 kB gzip</span><span class="chip">Consent Mode v2</span><span class="chip">React, Vue, Next.js</span></div>
</div>
</body>
</html>
